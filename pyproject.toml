[project]
name = "nldate"
version = "0.1.0"
dependencies = [
    "dateparser>=1.4.0",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-dateparser>=1.4.0.20260508",
    "types-python-dateutil>=2.9.0.20260508",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nldate"]
